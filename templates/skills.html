{% extends 'base.html' %}
{% block content %}
<h2>Skills Dashboard</h2>
<div class="progress-wrap"><div class="progress-bar" style="width: {{ progress.percentage }}%"></div></div>
<p><strong>{{ progress.label }}</strong></p>
<div class="card-grid">
  {% for badge in badges %}
  <article class="card">
    <span class="badge">Week {{ badge.week }}</span>
    <h3>{{ badge.title }}</h3>
    <p class="meta">{{ badge.skill }}</p>
  </article>
  {% else %}
  <article class="card"><p>Complete assignments to populate this dashboard.</p></article>
  {% endfor %}
</div>
{% endblock %}
